<title id="fb-title">Backward value flow and forward density flow along the time axis</title>
<desc id="fb-desc">The value u propagates backward from the terminal payoff at maturity toward today, while the density pi propagates forward from today toward maturity. Their pairing is invariant at every step.</desc>

<text class="fb-s fb-cap" x="340" y="272" text-anchor="middle">The pairing &#960;&#7488;u is the same number at every step</text>
</svg>
