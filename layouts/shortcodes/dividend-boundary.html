    <title id="db-title">Put exercise boundary with and without quarterly dividends</title>
    <desc id="db-desc">With four quarterly dividends of 0.5, the exercise boundary falls away and then breaks off shortly before each ex-dividend date, so the put is not exercised there, and jumps back up after the drop. After the last dividend it rejoins the no-dividend curve and climbs to the strike at expiry.</desc>
