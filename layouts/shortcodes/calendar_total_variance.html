<div class="calendar-tv-fig">
<div id="calTvPlot" style="width:100%;height:400px;"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
(function(){
  var D={"pts":[{"label":"Sep 2026","tau":0.0685,"w":0.00815},{"label":"Oct 2026","tau":0.1452,"w":0.01801},{"label":"Nov 2026","tau":0.2301,"w":0.02707},{"label":"Dec 2026","tau":0.3178,"w":0.03761},{"label":"Jan 2027","tau":0.3973,"w":0.04485}]};
  var css=getComputedStyle(document.documentElement);
  function v(n,f){var x=css.getPropertyValue(n).trim();return x||f;}
  var ink=v('--primary','#1d1e20'),muted=v('--secondary','#6b6b6b'),grid=v('--border','#e5e5e5');
  var accent='#2a78d6';
  var xs=D.pts.map(function(p){return p.tau;});
  var ys=D.pts.map(function(p){return p.w;});
  var labs=D.pts.map(function(p){return p.label;});
  var trace={x:xs,y:ys,mode:'lines+markers+text',type:'scatter',
    text:labs,textposition:'top center',textfont:{size:11,color:muted},
    line:{color:accent,width:2},marker:{color:accent,size:8},
    hovertemplate:'%{text}<br>τ %{x:.3f} yr<br>w %{y:.4f}<extra></extra>'};
  var layout={
    margin:{l:64,r:24,t:16,b:48},
    paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',
    font:{color:ink,family:'inherit',size:13},
    xaxis:{title:{text:'time to expiry  τ  (years)'},gridcolor:grid,zeroline:false,linecolor:grid,color:muted},
    yaxis:{title:{text:'ATM total variance  w = σ²τ'},gridcolor:grid,zeroline:false,linecolor:grid,color:muted},
    showlegend:false,hovermode:'closest'
  };
  Plotly.newPlot('calTvPlot',[trace],layout,{displayModeBar:false,responsive:true});
})();
</script>
