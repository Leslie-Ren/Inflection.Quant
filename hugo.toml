
#baseURL = "/"
baseURL = "https://inflectionquant.com/"
#baseURL = "https://yourusername.github.io/"
relativeURLs = true
canonifyURLs = false

languageCode = "en-us"
title = "Inflection Quant Lab"
theme = "PaperMod"

[params]
  math = true
  # mainSections = ["articles/quant-foundations", "articles/quant-engineering"]
  mainSections = ["articles"]
  ShowPostsOnHomePage = false
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

[params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.2
    minMatchCharLength = 0
    keys = ["title", "summary", "content", "tags"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"]]
      inline = [["$", "$"]]

[menu]
[[menu.main]]
  name = "Articles"
  url = "/articles/"
  weight = 1

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
