
#baseURL = "/"
baseURL = "https://inflection-quant.pages.dev/"
#baseURL = "https://yourusername.github.io/"
relativeURLs = true
canonifyURLs = false

languageCode = "en-us"
title = "Inflection Quant Lab"
theme = "PaperMod"

[params]
  math = true
  # mainSections = ["articles/quant-foundations", "articles/quant-engineering"]
  mainSections = ["articles"]
  ShowPostsOnHomePage = false
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true


[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"]]
      inline = [["$", "$"]]

[menu]
[[menu.main]]
  name = "Articles"
  url = "/articles/"
  weight = 1
